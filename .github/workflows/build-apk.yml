name: Build Boyon OMS Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK with Gradle
        run: gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Locate and Prepare APK
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at $APK_FILE"
            cp "$APK_FILE" Boyon-OMS-v1.0.apk
          else
            echo "Error: No APK file found in build outputs!"
            exit 1
          fi

      - name: Upload Boyon OMS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boyon-OMS-v1.0
          path: Boyon-OMS-v1.0.apk
          retention-days: 30

      - name: Create GitHub Release (Optional Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Boyon-OMS-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
